<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computational Worlds</title>

<style>
body{
  margin:0;
  background:#000;
  color:#7cff7c;
  font-family:monospace;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  cursor:pointer;
  overflow:hidden;
}

/* subtle CRT pulse */
body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.03) 0px,
      rgba(255,255,255,0.03) 1px,
      transparent 2px,
      transparent 4px
    );
  opacity:0.12;
}

/* title */
.title{
  font-size:14px;
  letter-spacing:0.18em;
  color:#00ff88;
  text-shadow:0 0 10px #00ff66;
  margin-bottom:10px;
  text-transform:uppercase;
}

/* portal */
canvas{
  width:min(440px,86vw);
  height:min(440px,86vw);
  border-radius:50%;
  border:2px solid rgba(0,255,0,0.5);
  background:#000;
  box-shadow:
    0 0 50px rgba(0,255,120,0.2) inset,
    0 0 18px rgba(0,255,0,0.7);
}

/* subtitles */
.subs{
  position:fixed;
  bottom:34px;
  width:min(540px,92vw);
  text-align:center;
  padding:6px 10px;
  font-size:14px;
  line-height:1.45;
  color:#b8ffb8;
  text-shadow:0 0 6px #00ff66;
  background:rgba(0,20,0,0.32);
  border:1px solid rgba(0,255,0,0.2);
  border-radius:6px;
  pointer-events:none;
  min-height:2em;
}

/* essay link */
.link{
  position:fixed;
  bottom:6px;
  width:min(540px,92vw);
  text-align:center;
  font-size:12px;
  color:#7cffc4;
  text-decoration:none;
  opacity:0.72;
}
.link:hover{
  opacity:1;
}
</style>
</head>

<body>

<div class="title">Computational Worlds</div>

<canvas id="viz"></canvas>

<div id="subs" class="subs"></div>

<a class="link"
   href="https://standardgalactic.github.io/calculus/computational_worlds.pdf"
   target="_blank">
  The Elements of Computational Worlds
</a>

<audio id="audio" preload="auto">
  <source src="Building_empires_with_simple_logic_gates.mp3" type="audio/mpeg">
</audio>

<script>

/* ─────────────────────────────────────────────
   ELEMENTS
───────────────────────────────────────────── */

const audio = document.getElementById("audio");
const subs  = document.getElementById("subs");

/* prevent link click from pausing audio */
document.querySelector(".link").onclick = e => e.stopPropagation();

/* ─────────────────────────────────────────────
   AUDIO GRAPH
───────────────────────────────────────────── */

let ctx, analyser, data;

function initAudio(){
  if(ctx) return;

  ctx = new AudioContext();

  analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;

  data = new Uint8Array(analyser.fftSize);

  const node = ctx.createMediaElementSource(audio);
  node.connect(analyser);
  analyser.connect(ctx.destination);
}

/* click anywhere = play/pause */
document.body.onclick = async ()=>{

  initAudio();

  if(ctx.state === "suspended"){
    await ctx.resume();
  }

  if(audio.paused){
    await audio.play();
  }else{
    audio.pause();
  }
};

/* ─────────────────────────────────────────────
   SUBTITLES
───────────────────────────────────────────── */

let cues = [];

async function loadVTT(url){

  cues = [];

  try{
    const res = await fetch(url);

    if(!res.ok) return;

    const text = await res.text();

    const blocks = text.split(/\n{2,}/);

    for(const block of blocks){

      const lines = block.trim().split("\n");

      const ts = lines.find(l => l.includes("-->"));

      if(!ts) continue;

      const [s,e] = ts.split("-->").map(x=>x.trim());

      const txt =
        lines
        .slice(lines.indexOf(ts)+1)
        .join(" ");

      cues.push({
        start: parseTime(s),
        end: parseTime(e),
        text: txt
      });
    }

  }catch(e){
    console.warn("VTT failed", e);
  }
}

function parseTime(t){

  const p = t.split(":");

  return p.length === 3
    ? +p[0]*3600 + +p[1]*60 + +p[2]
    : +p[0]*60 + +p[1];
}

audio.ontimeupdate = ()=>{

  const t = audio.currentTime;

  const cue = cues.find(c =>
    t >= c.start && t < c.end
  );

  subs.textContent = cue ? cue.text : "";
};

/* load subtitle file */
loadVTT("Building_empires_with_simple_logic_gates.vtt");

/* ─────────────────────────────────────────────
   CANVAS
───────────────────────────────────────────── */

const canvas = document.getElementById("viz");
const g = canvas.getContext("2d");

const W = 340;
const H = 340;

canvas.width = W;
canvas.height = H;

let tick = 0;

/* smooth oscillation helper */
function smoothNoise(x){
  return (
    Math.sin(x) * 0.5 +
    Math.sin(x * 0.7) * 0.3
  );
}

/* ─────────────────────────────────────────────
   DRAW LOOP
───────────────────────────────────────────── */

function draw(){

  tick++;

  /* phosphor fade */
  g.fillStyle = "rgba(0,5,0,0.07)";
  g.fillRect(0,0,W,H);

  const cx = W/2;
  const cy = H/2;
  const R  = W * 0.42;

  /* clip to portal */
  g.save();

  g.beginPath();
  g.arc(cx,cy,R,0,Math.PI*2);
  g.clip();

  /* ─────────────────────────────────────────
     GRID / CIRCUIT BACKGROUND
  ──────────────────────────────────────── */

  g.strokeStyle = "rgba(0,255,120,0.05)";

  const shiftX = Math.sin(tick*0.0012)*16;
  const shiftY = Math.cos(tick*0.0011)*16;

  for(let x=-W; x<W*2; x+=22){

    g.beginPath();

    g.moveTo(x+shiftX,-H);
    g.lineTo(x+shiftX,H*2);

    g.stroke();
  }

  for(let y=-H; y<H*2; y+=22){

    g.beginPath();

    g.moveTo(-W,y+shiftY);
    g.lineTo(W*2,y+shiftY);

    g.stroke();
  }

  /* faint node lattice */
  for(let x=0; x<W; x+=44){
    for(let y=0; y<H; y+=44){

      const pulse =
        0.15 +
        Math.sin((x+y+tick)*0.01)*0.08;

      g.fillStyle =
        `rgba(120,255,140,${pulse})`;

      g.fillRect(
        x+shiftX*0.2,
        y+shiftY*0.2,
        2,
        2
      );
    }
  }

  /* ─────────────────────────────────────────
     TRACE
  ──────────────────────────────────────── */

  if(analyser){

    analyser.getByteTimeDomainData(data);

    /* energy */
    let energy = 0;

    for(let i=0;i<data.length;i+=8){
      energy += Math.abs((data[i]-128)/128);
    }

    energy /= (data.length/8);

    /* empire-building feel:
       stable but gradually branching */
    const lag =
      Math.floor(
        data.length *
        (
          0.11 +
          smoothNoise(tick*0.01)*0.07
        )
      );

    const driftX =
      Math.sin(tick*0.0018)*10;

    const driftY =
      Math.cos(tick*0.0015)*8;

    /* ghost layer */
    g.beginPath();

    for(let i=0;i<data.length;i++){

      const a =
        (data[i]-128)/128;

      const b =
        (data[(i+lag)%data.length]-128)/128;

      const x =
        cx +
        driftX +
        a * R * 0.95;

      const y =
        cy +
        driftY +
        b * R * 0.82;

      if(i===0) g.moveTo(x,y);
      else      g.lineTo(x,y);
    }

    g.strokeStyle =
      `rgba(120,255,140,${
        0.18 + energy*0.18
      })`;

    g.lineWidth = 4;

    g.stroke();

    /* bright trace */
    g.beginPath();

    for(let i=0;i<data.length;i++){

      const a =
        (data[i]-128)/128;

      const b =
        (data[(i+lag)%data.length]-128)/128;

      const x =
        cx +
        driftX +
        a * R * 0.95;

      const y =
        cy +
        driftY +
        b * R * 0.82;

      if(i===0) g.moveTo(x,y);
      else      g.lineTo(x,y);
    }

    g.strokeStyle = "#7cffc4";

    g.lineWidth =
      1.6 + energy*1.6;

    g.shadowBlur =
      12 + energy*18;

    g.shadowColor = "#00ff66";

    g.stroke();

    g.shadowBlur = 0;
  }

  /* portal edge glow */
  g.beginPath();
  g.arc(cx,cy,R,0,Math.PI*2);

  g.strokeStyle =
    "rgba(120,255,180,0.28)";

  g.lineWidth = 2;

  g.stroke();

  g.restore();

  requestAnimationFrame(draw);
}

draw();

</script>

</body>
</html>
