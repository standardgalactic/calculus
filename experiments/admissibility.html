<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Orthodromic Worlds — Admissibility</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg:#070a10;
    --panel:#0d1420;
    --panel-line:#1c2836;
    --teal:#2fd0da;
    --teal-dim:#164a4f;
    --gold:#e8b34a;
    --red:#e5495f;
    --ice:#eef3f6;
    --muted:#6b7a89;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--ice);
    font-family:'Space Grotesk', system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body{ display:flex; justify-content:center; padding:28px 16px 48px; }
  .stage{ width:100%; max-width:420px; }
  .eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--muted); margin:0 0 4px;
  }
  h1{ font-size:20px; font-weight:600; margin:0 0 16px; letter-spacing:0.01em; }

  .progress{ display:flex; gap:6px; margin-bottom:14px; }
  .progress .step{
    flex:1; padding:7px 0; text-align:center; border-radius:6px; border:1px solid var(--panel-line);
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted); background:var(--panel);
  }
  .progress .step.done{ border-color:var(--gold); color:var(--gold); }
  .progress .step.active{ border-color:var(--teal); color:var(--teal); }

  .panel{ background:var(--panel); border:1px solid var(--panel-line); border-radius:12px; padding:16px; margin-bottom:14px; }
  canvas{ display:block; width:100%; height:auto; touch-action:none; cursor:pointer; }

  .diag{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:12px; }
  .diag .cell{ background:var(--bg); border:1px solid var(--panel-line); border-radius:8px; padding:8px 10px; }
  .diag .label{ font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--muted); letter-spacing:0.04em; }
  .diag .value{ font-family:'JetBrains Mono', monospace; font-size:15px; margin-top:2px; }
  .diag .value.hot{ color:var(--gold); }
  .diag .value.danger{ color:var(--red); }

  .hint{ font-size:12px; color:var(--muted); text-align:center; margin-top:8px; }

  .result{
    min-height:74px; border-radius:12px; padding:14px 16px; margin-bottom:14px;
    display:flex; flex-direction:column; gap:4px; justify-content:center;
    border:1px solid var(--panel-line); background:var(--panel);
    transition:border-color .2s, background .2s;
  }
  .result.locked{ border-color:var(--gold); background:linear-gradient(180deg, rgba(232,179,74,0.08), var(--panel)); }
  .result.collapse{ border-color:var(--red); background:linear-gradient(180deg, rgba(229,73,95,0.08), var(--panel)); }
  .result.done{ border-color:var(--gold); background:linear-gradient(180deg, rgba(232,179,74,0.16), var(--panel)); }
  .result .status{
    font-family:'JetBrains Mono', monospace; font-size:13px; letter-spacing:0.06em;
    text-transform:uppercase; font-weight:700;
  }
  .result.locked .status, .result.done .status{ color:var(--gold); }
  .result.collapse .status{ color:var(--red); }
  .result.idle .status{ color:var(--muted); }
  .result .detail{ font-size:13px; color:var(--muted); font-family:'JetBrains Mono', monospace; }

  .actions{ display:flex; gap:10px; }
  .actions button{
    flex:1; padding:12px 0; border-radius:8px; border:none; cursor:pointer;
    font-family:'Space Grotesk', sans-serif; font-size:14px; font-weight:600;
    background:var(--teal); color:#04252a; transition:transform .1s;
  }
  .actions button:active{ transform:scale(0.98); }
  .actions button.secondary{ background:transparent; border:1px solid var(--panel-line); color:var(--ice); }
</style>
</head>
<body>
<div class="stage">
  <p class="eyebrow">Orthodromic Worlds &middot; admissibility</p>
  <h1 id="title">Placing n6</h1>

  <div class="progress" id="progress"></div>

  <div class="panel">
    <canvas id="sphere" width="760" height="620"></canvas>
    <p class="hint">Tap the sphere to lock the candidate ring</p>
  </div>

  <div class="panel">
    <div class="diag" id="diag"></div>
  </div>

  <div class="result idle" id="result">
    <div class="status" id="status">Sweeping</div>
    <div class="detail" id="detail">&beta; oscillating</div>
  </div>

  <div class="actions">
    <button id="lockBtn">Lock</button>
    <button class="secondary" id="resetBtn">Restart</button>
  </div>
</div>

<script>
const sqrt2 = Math.SQRT2;
const FIXED = [
  { n:[0,0,1], label:'n1 equator' },
  { n:[1,0,0], label:'n2' },
  { n:[0,1,0], label:'n3' },
  { n:[1/sqrt2,1/sqrt2,0], label:'n4' },
  { n:[-1/sqrt2,1/sqrt2,0], label:'n5' },
];
const RING_DEFS = [
  { id:'n6', lambda:0,  targetBeta:-45, omega:1.0, eps:5.0, collapseHalf:7.0 },
  { id:'n7', lambda:0,  targetBeta:45,  omega:1.25,eps:4.3, collapseHalf:6.3 },
  { id:'n8', lambda:90, targetBeta:-45, omega:1.55,eps:3.6, collapseHalf:5.6 },
  { id:'n9', lambda:90, targetBeta:45,  omega:1.9, eps:3.0, collapseHalf:5.0 },
];

function normal(betaDeg, lambdaDeg){
  const b = betaDeg*Math.PI/180, l = lambdaDeg*Math.PI/180;
  return [Math.cos(b)*Math.cos(l), Math.cos(b)*Math.sin(l), Math.sin(b)];
}
function dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function deltaDeg(a,b){ return Math.acos(Math.min(1,Math.max(-1,Math.abs(dot(a,b))))) * 180/Math.PI; }
function cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function normalize(a){ const m=Math.hypot(a[0],a[1],a[2])||1; return [a[0]/m,a[1]/m,a[2]/m]; }
function basisFor(n){
  let arb = Math.abs(n[2]) < 0.9 ? [0,0,1] : [1,0,0];
  let u = normalize(cross(arb, n));
  let v = cross(n, u);
  return [u, v];
}
function lerp(a,b,t){ return a+(b-a)*t; }
function mixHex(hexA, hexB, t){
  t = Math.max(0, Math.min(1, t));
  const pa = [1,3,5].map(i=>parseInt(hexA.slice(i,i+2),16));
  const pb = [1,3,5].map(i=>parseInt(hexB.slice(i,i+2),16));
  const c = pa.map((v,i)=>Math.round(lerp(v, pb[i], t)));
  return '#' + c.map(v=>v.toString(16).padStart(2,'0')).join('');
}

let ringIndex = 0;
let locked = [];
let running = true;
let startT = performance.now();
let frozenBeta = null;
let rotStartT = performance.now();
let flashUntil = 0;
let allDone = false;

function existingCircles(){ return FIXED.concat(locked); }

function ringDef(){ return RING_DEFS[ringIndex]; }

function currentBeta(nowMs){
  if (frozenBeta !== null) return frozenBeta;
  const rd = ringDef();
  const tSec = (nowMs - startT) / 1000;
  return rd.amp !== undefined ? rd.amp*Math.sin(rd.omega*tSec) : 82*Math.sin(rd.omega*tSec);
}

function computeState(betaDeg){
  const rd = ringDef();
  const cand = normal(betaDeg, rd.lambda);
  const targetN = normal(rd.targetBeta, rd.lambda);
  const existing = existingCircles();
  const targets = existing.map(e => deltaDeg(targetN, e.n));
  const live = existing.map(e => deltaDeg(cand, e.n));
  const hb = live.map((d,i)=> d - targets[i]);
  const maxAbsH = Math.max(...hb.map(Math.abs));
  const minDelta = Math.min(...live);
  const kappa = 1.6, eps0 = 2.0;
  const J = hb.reduce((s,h)=>s+h*h,0) + kappa * live.reduce((s,d)=>s+1/(d+eps0),0);

  const nearCenter = Math.abs(betaDeg) <= rd.collapseHalf;
  const nearEdge = Math.abs(Math.abs(betaDeg) - 90) <= rd.collapseHalf;
  const collapse = nearCenter || nearEdge;
  const lock = !collapse && Math.abs(betaDeg - rd.targetBeta) <= rd.eps;

  return { beta:betaDeg, cand, maxAbsH, minDelta, J, collapse, lock, targetBeta: rd.targetBeta };
}

const CAM_TILT = 22 * Math.PI/180;

function project(v, rotAz){
  const cz = Math.cos(rotAz), sz = Math.sin(rotAz);
  const x1 = v[0]*cz - v[1]*sz;
  const y1 = v[0]*sz + v[1]*cz;
  const z1 = v[2];
  const ry = y1*Math.cos(CAM_TILT) - z1*Math.sin(CAM_TILT);
  const rz = y1*Math.sin(CAM_TILT) + z1*Math.cos(CAM_TILT);
  return [x1, ry, rz];
}

function circlePoints(n, rotAz, segs){
  const [u,v] = basisFor(n);
  const pts = [];
  for (let i=0;i<=segs;i++){
    const t = i/segs*Math.PI*2;
    const ct=Math.cos(t), st=Math.sin(t);
    const raw = [ct*u[0]+st*v[0], ct*u[1]+st*v[1], ct*u[2]+st*v[2]];
    pts.push(project(raw, rotAz));
  }
  return pts;
}

function drawCircle(ctx, cx, cy, R, n, rotAz, color, lw, alphaMul){
  const pts = circlePoints(n, rotAz, 96);
  for (let i=0;i<pts.length-1;i++){
    const a=pts[i], b=pts[i+1];
    const frontA=a[2]>=0, frontB=b[2]>=0;
    const op = (frontA&&frontB) ? 1.0 : ((!frontA&&!frontB) ? 0.22 : 0.55);
    ctx.strokeStyle = color;
    ctx.globalAlpha = op * (alphaMul===undefined?1:alphaMul);
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(cx+a[0]*R, cy-a[1]*R);
    ctx.lineTo(cx+b[0]*R, cy-b[1]*R);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

const sphereCanvas = document.getElementById('sphere');
const sctx = sphereCanvas.getContext('2d');

function candidateColor(state){
  const tGold = Math.max(0, 1 - state.maxAbsH/40);
  const tRed = Math.max(0, 1 - state.minDelta/15);
  const base = '#eef3f6';
  if (tRed > tGold) return mixHex(base, '#e5495f', tRed);
  return mixHex(base, '#e8b34a', tGold);
}

function renderSphere(state, nowMs){
  const W=sphereCanvas.width, H=sphereCanvas.height;
  sctx.clearRect(0,0,W,H);
  const cx=W/2, cy=H/2+10, R=230;
  const rotAz = (nowMs - rotStartT)/1000 * 0.18;

  sctx.strokeStyle = '#1c2836'; sctx.lineWidth = 1;
  sctx.beginPath(); sctx.ellipse(cx,cy,R,R,0,0,Math.PI*2); sctx.stroke();

  const flashing = nowMs < flashUntil;
  const flashAlpha = flashing ? (0.5 + 0.5*Math.sin((flashUntil-nowMs)*0.03)) : 1;

  for (const f of FIXED) drawCircle(sctx, cx, cy, R, f.n, rotAz, '#2b6b70', 1.3, flashing?flashAlpha:1);
  for (const l of locked) drawCircle(sctx, cx, cy, R, l, rotAz, '#e8b34a', 2.4, flashing?flashAlpha:1);

  if (!allDone){
    const col = state.collapse ? '#e5495f' : (state.lock ? '#e8b34a' : candidateColor(state));
    drawCircle(sctx, cx, cy, R, state.cand, rotAz, col, 3.2, 1);
  } else if (flashing) {
    drawCircle(sctx, cx, cy, R, RING_DEFS[3] ? normal(RING_DEFS[3].targetBeta, RING_DEFS[3].lambda) : [0,0,1], rotAz, '#e8b34a', 3.2, flashAlpha);
  }
}

function fmt(v){ return (Math.abs(v) < 0.005 ? 0 : v).toFixed(2); }

function renderDiag(state){
  const el = document.getElementById('diag');
  const n = existingCircles().length;
  el.innerHTML = `
    <div class="cell"><div class="label">MAX |h_b|  (${n})</div><div class="value ${state.maxAbsH<1?'hot':''}">${fmt(state.maxAbsH)}&deg;</div></div>
    <div class="cell"><div class="label">MIN &delta;_ij</div><div class="value ${state.minDelta<state.minDeltaWarn?'danger':''}">${fmt(state.minDelta)}&deg;</div></div>
    <div class="cell"><div class="label">J(&theta;)</div><div class="value">${fmt(state.J)}</div></div>
  `;
}

let lastState = null;

function updateTitleProgress(){
  document.getElementById('title').textContent = allDone ? 'Configuration locked' : `Placing ${ringDef().id}`;
  const prog = document.getElementById('progress');
  prog.innerHTML = '';
  RING_DEFS.forEach((rd,i)=>{
    const d = document.createElement('div');
    d.className = 'step' + (i<ringIndex||allDone?' done':(i===ringIndex&&!allDone?' active':''));
    d.textContent = rd.id;
    prog.appendChild(d);
  });
}

function setResultUI(state){
  const box=document.getElementById('result'), status=document.getElementById('status'), detail=document.getElementById('detail');
  box.classList.remove('locked','collapse','idle','done');
  if (allDone){
    box.classList.add('done');
    status.textContent = 'All nine orthodromes admissible';
    detail.textContent = 'V=26, E=72, F=48 \u2014 the full cubic-symmetric arrangement';
    return;
  }
  if (frozenBeta === null){
    box.classList.add('idle');
    status.textContent = 'Sweeping';
    const n = existingCircles().length;
    detail.textContent = `${ringDef().id} against ${n} existing orthodrome${n>1?'s':''}`;
    return;
  }
  if (state.lock){
    box.classList.add('locked');
    status.textContent = 'Locked';
    detail.textContent = `${ringDef().id} \u00B7 \u03B2=${state.beta.toFixed(2)}\u00B0 \u00B7 max|h_b|=${fmt(state.maxAbsH)}\u00B0`;
  } else if (state.collapse){
    box.classList.add('collapse');
    status.textContent = 'Collapse';
    detail.textContent = `Coincides with an existing orthodrome \u00B7 \u03B2=${state.beta.toFixed(2)}\u00B0`;
  } else {
    box.classList.add('idle');
    status.textContent = 'Miss';
    detail.textContent = `\u03B2=${state.beta.toFixed(2)}\u00B0 \u00B7 max|h_b|=${fmt(state.maxAbsH)}\u00B0 from admissible`;
  }
}

function frame(now){
  if (!allDone){
    const beta = currentBeta(now);
    lastState = computeState(beta);
    lastState.minDeltaWarn = ringDef().collapseHalf * 2.2;
    renderSphere(lastState, now);
    renderDiag(lastState);
  } else {
    renderSphere({}, now);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function toggleLock(){
  if (allDone) return;
  if (frozenBeta === null){
    frozenBeta = lastState.beta;
    setResultUI(lastState);
    if (lastState.lock){
      locked.push(normal(ringDef().targetBeta, ringDef().lambda));
      flashUntil = performance.now() + 500;
      setTimeout(()=>{
        ringIndex++;
        frozenBeta = null;
        startT = performance.now();
        if (ringIndex >= RING_DEFS.length){
          allDone = true;
          flashUntil = performance.now() + 1400;
        }
        updateTitleProgress();
        setResultUI(lastState);
      }, 550);
    }
  } else {
    frozenBeta = null;
    startT = performance.now();
    setResultUI({});
  }
}

document.getElementById('lockBtn').addEventListener('click', toggleLock);
document.getElementById('resetBtn').addEventListener('click', ()=>{
  ringIndex = 0; locked = []; frozenBeta = null; allDone = false;
  startT = performance.now(); rotStartT = performance.now();
  updateTitleProgress(); setResultUI({});
});
sphereCanvas.addEventListener('pointerdown', toggleLock);

updateTitleProgress();
setResultUI({});
</script>
</body>
</html>
